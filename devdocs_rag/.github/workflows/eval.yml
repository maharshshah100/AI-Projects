name: eval

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  run-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build index
        env:
          DEVDOCS_FORCE_LOCAL_EMBEDDER: "0"
        run: python3 src/build_index.py

      - name: Run eval suite
        run: python3 eval/run_eval.py

      - name: Upload eval report
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval/eval_report.json
